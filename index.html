<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tahiri Digital Studio</title>
<meta name="description" content="Poster, banner and invitation designs. Order on WhatsApp: 0319 1285508.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#ffffff;
    --cream:#faf9f5;
    --tint:#fbece5;
    --line:#ebe6dc;
    --text:#1f1e1d;
    --muted:#6b6760;
    --orange:#d97757;      /* Claude orange */
    --orange-d:#c15f3c;    /* darker orange for buttons and text */
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Bricolage Grotesque',system-ui,sans-serif;
    background:var(--bg);color:var(--text);line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  html[lang="sd"] body{font-family:'Noto Naskh Arabic','Bricolage Grotesque',serif;line-height:1.9}
  html[lang="ur"] body{font-family:'Noto Nastaliq Urdu','Noto Naskh Arabic',serif;line-height:2.1}
  html[lang="ur"] h1,html[lang="ur"] h2{line-height:1.7!important}
  img{display:block;max-width:100%}
  a{color:inherit;text-decoration:none}
  :focus-visible{outline:3px solid var(--orange);outline-offset:3px}
  .wrap{width:min(1240px,100% - 32px);margin-inline:auto}

  /* ---------- Header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(255,255,255,.92);backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;min-height:66px;gap:12px}
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand b{font-size:1.1rem;font-weight:800;letter-spacing:-.01em;color:var(--orange-d)}
  .brand span{font-family:'Noto Naskh Arabic',serif;font-size:.85rem;color:var(--muted)}
  .nav nav{display:flex;gap:18px;align-items:center;font-size:.95rem;color:var(--muted)}
  .nav nav a:not(.btn):hover{color:var(--orange-d)}

  .lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--cream);direction:ltr}
  .lang button{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    padding:6px 12px;border-radius:999px;font:inherit;font-size:.85rem;line-height:1.4;
  }
  .lang button[aria-pressed="true"]{background:var(--orange-d);color:#fff}
  .lang button[data-lang="ur"],.lang button[data-lang="sd"]{font-family:'Noto Naskh Arabic',serif;font-size:.95rem}

  .btn{
    display:inline-flex;align-items:center;gap:8px;
    padding:11px 22px;border-radius:999px;font-weight:600;font-size:.95rem;
    border:1px solid transparent;cursor:pointer;font-family:inherit;
    transition:transform .15s ease, background .15s ease;
  }
  .btn:active{transform:scale(.97)}
  .btn-main{background:var(--orange-d);color:#fff}
  .btn-main:hover{background:#a94f30}
  .btn-ghost{border-color:var(--line);color:var(--text);background:#fff}
  .btn-ghost:hover{border-color:var(--orange);color:var(--orange-d)}
  @media(max-width:860px){.nav nav a.hide-m{display:none}}
  @media(max-width:560px){.nav nav .btn{display:none}.brand span{display:none}}

  /* ---------- Hero ---------- */
  .hero{padding:56px 0 40px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
  .hero h1{font-size:clamp(2.1rem,5vw,4.1rem);line-height:1.05;font-weight:800;letter-spacing:-.03em}
  .hero p{margin:20px 0 28px;color:var(--muted);max-width:46ch;font-size:1.08rem}
  .hero .cta{display:flex;gap:12px;flex-wrap:wrap}
  .stack{position:relative;height:420px;background:var(--tint);border-radius:28px;overflow:hidden}
  .stack img{
    position:absolute;width:44%;aspect-ratio:2/3;object-fit:cover;
    border-radius:12px;border:4px solid #fff;
    box-shadow:0 18px 40px rgba(193,95,60,.25);
  }
  .stack img:nth-child(1){left:4%;top:16%;transform:rotate(-6deg)}
  .stack img:nth-child(2){left:28%;top:6%;transform:rotate(2deg);z-index:2}
  .stack img:nth-child(3){right:4%;top:20%;transform:rotate(7deg)}
  @media(max-width:860px){
    .hero{grid-template-columns:1fr;padding-top:32px}
    .stack{height:320px;order:-1}
  }

  /* ---------- Sections ---------- */
  section{padding:44px 0}
  #new{background:var(--cream);border-block:1px solid var(--line)}
  .head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px;flex-wrap:wrap}
  .head h2{font-size:clamp(1.6rem,3.2vw,2.4rem);letter-spacing:-.02em;line-height:1.15}
  .head p{color:var(--muted);max-width:44ch}
  .badge{
    display:inline-block;background:var(--orange);color:#fff;
    font-size:.78rem;font-weight:700;padding:2px 12px;border-radius:999px;
    vertical-align:middle;margin-inline-start:10px;line-height:1.6
  }

  .strip{
    display:flex;gap:16px;overflow-x:auto;padding-bottom:14px;
    scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:var(--orange) var(--line);
  }
  .strip .card{flex:0 0 clamp(190px,24vw,260px);scroll-snap-align:start}
  .empty{
    border:1px dashed var(--line);border-radius:var(--radius);background:#fff;
    padding:28px;color:var(--muted);text-align:center;width:100%
  }

  /* ---------- Cards ---------- */
  .card{
    position:relative;border-radius:var(--radius);overflow:hidden;
    background:#fff;border:1px solid var(--line);cursor:zoom-in;
    break-inside:avoid;margin-bottom:16px;
    transition:box-shadow .2s ease,border-color .2s ease;
  }
  .card:hover{border-color:var(--orange);box-shadow:0 10px 28px rgba(193,95,60,.18)}
  .strip .card{margin-bottom:0}
  .card img{width:100%;height:auto}
  .card .over{
    position:absolute;inset:auto 0 0 0;padding:34px 12px 12px;
    background:linear-gradient(transparent,rgba(31,30,29,.8));
    display:flex;justify-content:center;
    opacity:0;transition:opacity .2s;
  }
  .card:hover .over,.card:focus-within .over{opacity:1}
  .card .over button{
    background:var(--orange-d);color:#fff;border:0;border-radius:999px;
    padding:8px 16px;font-weight:600;font-size:.85rem;cursor:pointer;font-family:inherit
  }
  .card .tag{
    position:absolute;top:10px;inset-inline-start:10px;background:var(--orange-d);color:#fff;
    font-size:.74rem;font-weight:700;padding:1px 10px;border-radius:999px;z-index:1;line-height:1.7
  }
  @media(hover:none){.card .over{opacity:1}}

  .tools input{
    background:#fff;border:1px solid var(--line);color:var(--text);
    padding:11px 18px;border-radius:999px;font:inherit;min-width:230px
  }
  .tools input:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--tint)}
  .count{color:var(--muted);font-size:.92rem}

  .masonry{column-count:4;column-gap:16px}
  @media(max-width:1100px){.masonry{column-count:3}}
  @media(max-width:760px){.masonry{column-count:2;column-gap:10px}.card{margin-bottom:10px}}
  .more{display:flex;justify-content:center;margin-top:20px}

  /* ---------- Order ---------- */
  .order{
    background:var(--tint);border:1px solid #f1d5c8;border-radius:24px;
    padding:clamp(22px,5vw,56px);display:grid;grid-template-columns:1fr 1fr;gap:40px;
  }
  .order h2{font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.15;letter-spacing:-.02em}
  .order p{color:var(--muted);margin:14px 0 22px;max-width:44ch}
  .steps{list-style:none;display:grid;gap:12px}
  .steps li{display:flex;gap:12px;align-items:flex-start}
  .steps i{
    flex:0 0 28px;height:28px;border-radius:50%;background:var(--orange-d);color:#fff;
    font-style:normal;font-weight:700;display:grid;place-items:center;font-size:.9rem;font-family:'Bricolage Grotesque',sans-serif
  }
  .phone{font-size:1.6rem;font-weight:800;letter-spacing:.02em;margin-top:18px;color:var(--orange-d);direction:ltr;unicode-bidi:isolate;font-family:'Bricolage Grotesque',sans-serif}
  form{display:grid;gap:14px;background:#fff;padding:22px;border-radius:18px;border:1px solid #f1d5c8}
  label{font-size:.9rem;color:var(--muted);display:grid;gap:6px}
  input,select,textarea{
    background:#fff;border:1px solid var(--line);color:var(--text);
    padding:12px 14px;border-radius:10px;font:inherit;width:100%
  }
  input:focus,select:focus,textarea:focus{border-color:var(--orange);outline:none;box-shadow:0 0 0 3px var(--tint)}
  textarea{min-height:110px;resize:vertical}
  @media(max-width:820px){.order{grid-template-columns:1fr}}

  footer{border-top:1px solid var(--line);padding:26px 0;color:var(--muted);font-size:.9rem;margin-top:30px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}

  /* ---------- Lightbox ---------- */
  .lb{
    position:fixed;inset:0;background:rgba(31,30,29,.93);z-index:100;
    display:none;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:14px
  }
  .lb.open{display:flex}
  .lb img{max-height:78vh;max-width:min(94vw,900px);border-radius:10px;object-fit:contain;background:#fff}
  .lb .x,.lb .nv{
    position:absolute;background:#fff;border:0;color:var(--text);
    width:44px;height:44px;border-radius:50%;font-size:1.3rem;cursor:pointer
  }
  .lb .x{top:14px;right:16px}
  .lb .nv{top:50%;transform:translateY(-50%)}
  .lb .prev{left:12px}.lb .next{right:12px}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

  <section id="new">

  </section>

  </section>

  <section id="order">

        <div>
          <h2 data-i18n="orderTitle"></h2>

        </div>

        <form id="orderForm">
          <label><span data-i18n="fName"></span>
            <input id="fName" required>
          </label>
          <label><span data-i18n="fType"></span>
            <select id="fType">
              <option value="poster" data-i18n="t_poster"></option>
              <option value="banner" data-i18n="t_banner"></option>
              <option value="invite" data-i18n="t_invite"></option>
              <option value="sign" data-i18n="t_sign"></option>
              <option value="other" data-i18n="t_other"></option>
            </select>
          </label>
          <label><span data-i18n="fImage"></span>
            <input id="fImage" data-i18n-ph="fImagePh">
          </label>
          <label><span data-i18n="fMsg"></span>
            <textarea id="fMsg" data-i18n-ph="fMsgPh"></textarea>
          </label>
          <button class="btn btn-main" type="submit" data-i18n="send"></button>
        </form>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="yr"></span> Tahiri Digital Studio</span>
    <span data-i18n="footerWa"></span>
  </div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="x" id="lbClose" aria-label="Close">×</button>
  <button class="nv prev" id="lbPrev" aria-label="Previous">‹</button>

  <button class="nv next" id="lbNext" aria-label="Next">›</button>
  <button class="btn btn-main" id="lbOrder" data-i18n="orderThis"></button>
</div>

    fName:"توهان جو نالو", fType:"توهان کي ڇا گهرجي؟",
    t_poster:"پوسٽر", t_banner:"بينر", t_invite:"دعوت نامو", t_sign:"دڪان جو سائن بورڊ", t_other:"ٻيو",
    fImage:"توهان کي پسند ڊيزائن (اختياري)", fImagePh:"ڪنهن به تصوير تي “هي ڊيزائن آرڊر ڪريو” دٻايو",
    fMsg:"تفصيل", fMsgPh:"نالا، تاريخ، جاءِ، فون نمبر، ٻولي…",
    send:"واٽس ايپ تي موڪليو", footerWa:"واٽس ايپ: 0319 1285508",
    waHello:"السلام عليڪم طاهري ڊجيٽل اسٽوڊيو، مان هڪ ڊيزائن آرڊر ڪرڻ چاهيان ٿو.",

/* =====================================================
   CODE  –  no need to change anything below
   ===================================================== */
const EXT = /\.(jpe?g|png|webp|gif|avif)$/i;
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

let lang = CONFIG.defaultLang;
try { const saved = localStorage.getItem("lang"); if (I18N[saved]) lang = saved; } catch(e){}
const t = k => I18N[lang][k] ?? I18N.en[k] ?? k;

let allImgs = [], newImgs = [];
let shown = CONFIG.pageSize, query = "";
let lbList = [], lbIndex = 0;

$("#yr").textContent = new Date().getFullYear();

/* ---------- language ---------- */
function applyLang(){
  const L = I18N[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  document.title = L.title;
  $$("[data-i18n]").forEach(el => el.textContent = t(el.dataset.i18n));
  $$("[data-i18n-ph]").forEach(el => el.placeholder = t(el.dataset.i18nPh));
  $$(".lang button").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === lang));
  renderNew(); renderGrid();
}
$$(".lang button").forEach(b => b.addEventListener("click", () => {
  lang = b.dataset.lang;
  try { localStorage.setItem("lang", lang); } catch(e){}
  applyLang();
}));

/* ---------- load images from GitHub folders ---------- */
function detectRepo(){
  const h = location.hostname;
  let user = CONFIG.githubUser, repo = CONFIG.repo;
  if (h.endsWith("github.io")) {
    user = h.split(".")[0];
    if (!repo) repo = location.pathname.split("/")[1] || (user + ".github.io");
  }
  return {user, repo};
}
async function listFolder(folder){
  const {user, repo} = detectRepo();
  if (!user || !repo) throw new Error("repo unknown");
  const res = await fetch(`https://api.github.com/repos/${user}/${repo}/contents/${folder}?ref=${CONFIG.branch}`);
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  return data.filter(f => f.type === "file" && EXT.test(f.name)).map(f => ({src:`${folder}/${f.name}`, name:f.name}));
}
async function load(){
  let all = [], nw = [];
  try { all = await listFolder(CONFIG.allFolder); } catch(e){}
  try { nw  = await listFolder(CONFIG.newFolder);  } catch(e){}
  if (!all.length) all = CONFIG.manualAll.map(s => ({src:s, name:s.split("/").pop()}));
  if (!nw.length)  nw  = CONFIG.manualNew.map(s => ({src:s, name:s.split("/").pop()}));
  newImgs = nw.map(i => ({...i, isNew:true}));
  allImgs = [...newImgs, ...all.sort((a,b) => b.name.localeCompare(a.name))];
  renderHero(); renderNew(); renderGrid();
}

/* ---------- render ---------- */
function card(img, list, idx){
  const el = document.createElement("div");
  el.className = "card"; el.tabIndex = 0;
  el.innerHTML = `
    ${img.isNew ? `<span class="tag">${t("newBadge")}</span>` : ""}
    <img src="${img.src}" alt="${img.name}" loading="lazy">
    <div class="over"><button type="button">${t("orderThis")}</button></div>`;
  el.addEventListener("click", e => e.target.closest("button") ? orderImage(img) : openLb(list, idx));
  el.addEventListener("keydown", e => { if (e.key === "Enter") openLb(list, idx); });
  return el;
}
function renderHero(){
  const box = $("#heroStack"); box.innerHTML = "";
  (newImgs.length ? newImgs : allImgs).slice(0,3).forEach(p => {
    const i = document.createElement("img"); i.src = p.src; i.alt = ""; box.appendChild(i);
  });
}
function renderNew(){
  const box = $("#newStrip"); box.innerHTML = "";
  if (!newImgs.length){ box.innerHTML = `<div class="empty">${t("newEmpty")}</div>`; return; }
  newImgs.forEach((img,i) => box.appendChild(card(img, newImgs, i)));
}
function filtered(){
  const q = query.trim().toLowerCase();
  return q ? allImgs.filter(i => i.name.toLowerCase().includes(q)) : allImgs;
}
function renderGrid(){
  const list = filtered(), grid = $("#grid");
  grid.innerHTML = "";
  if (!list.length) grid.innerHTML = `<div class="empty">${t("none")}</div>`;
  list.slice(0, shown).forEach((img,i) => grid.appendChild(card(img, list, i)));
  $("#count").textContent = t("count").replace("{n}", list.length);
  $("#moreBtn").hidden = shown >= list.length;
}
$("#moreBtn").onclick = () => { shown += CONFIG.pageSize; renderGrid(); };
$("#search").addEventListener("input", e => { query = e.target.value; shown = CONFIG.pageSize; renderGrid(); });

/* ---------- lightbox ---------- */
function openLb(list, i){ lbList = list; lbIndex = i; showLb(); $("#lb").classList.add("open"); document.body.style.overflow = "hidden"; }
function showLb(){ const im = lbList[lbIndex]; $("#lbImg").src = im.src; $("#lbImg").alt = im.name; }
function closeLb(){ $("#lb").classList.remove("open"); document.body.style.overflow = ""; }
function step(d){ lbIndex = (lbIndex + d + lbList.length) % lbList.length; showLb(); }
$("#lbClose").onclick = closeLb;
$("#lbPrev").onclick = () => step(-1);
$("#lbNext").onclick = () => step(1);
$("#lb").addEventListener("click", e => { if (e.target.id === "lb") closeLb(); });
$("#lbOrder").onclick = () => { orderImage(lbList[lbIndex]); closeLb(); };
document.addEventListener("keydown", e => {
  if (!$("#lb").classList.contains("open")) return;
  if (e.key === "Escape") closeLb();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

/* ---------- order ---------- */
function orderImage(img){
  $("#fImage").value = img.name;
  $("#order").scrollIntoView({behavior:"smooth"});
  setTimeout(() => $("#fName").focus(), 500);
}
$("#orderForm").addEventListener("submit", e => {
  e.preventDefault();
  const typeText = $("#fType").selectedOptions[0].textContent;
  const lines = [t("waHello"), "", `${t("waName")}: ${$("#fName").value}`, `${t("waType")}: ${typeText}`];
  if ($("#fImage").value) lines.push(`${t("waDesign")}: ${$("#fImage").value}`);
  if ($("#fMsg").value)   lines.push(`${t("waDetails")}: ${$("#fMsg").value}`);
  window.open(`https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(lines.join("\n"))}`, "_blank");
});

applyLang();
load();
</script>
